name: Android verification

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee unit-test.log
      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatago-unit-test-log
          path: unit-test.log
      - name: Stop after failed unit tests
        if: steps.unit.outcome == 'failure'
        run: exit 1
      - name: Debug APK
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: khatago-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
