name: Android verification

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee unit-test.log
      - name: Upload unit-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatago-unit-test-log
          path: unit-test.log
      - name: Debug APK
        id: debug
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee debug-build.log
      - name: Upload debug build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatago-debug-build-log
          path: debug-build.log
      - name: Upload debug APK
        if: steps.debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: khatago-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Report verification failure
        if: steps.unit.outcome == 'failure' || steps.debug.outcome == 'failure'
        run: |
          if [ "${{ steps.unit.outcome }}" = "failure" ]; then
            grep -E 'e: |error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved reference|Compilation error' unit-test.log | tail -n 25 | while IFS= read -r line; do echo "::error file=unit-test.log,line=1::$line"; done
          fi
          if [ "${{ steps.debug.outcome }}" = "failure" ]; then
            grep -E 'e: |error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved reference|Compilation error' debug-build.log | tail -n 25 | while IFS= read -r line; do echo "::error file=debug-build.log,line=1::$line"; done
          fi
      - name: Stop after verification failure
        if: steps.unit.outcome == 'failure' || steps.debug.outcome == 'failure'
        run: exit 1
