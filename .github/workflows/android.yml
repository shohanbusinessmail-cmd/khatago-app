name: Android verification

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test-lint-release:
    name: Build, test, lint and release compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM unit tests
        run: ./gradlew test --stacktrace
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Release APK compilation
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: khatago-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatago-verification-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  instrumentation:
    name: Room instrumentation tests
    runs-on: ubuntu-latest
    needs: build-test-lint-release
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run connected tests on API 35 emulator
        id: instrument
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -o pipefail
            ./gradlew connectedDebugAndroidTest --stacktrace 2>&1 | tee instrumentation.log
      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khatago-instrumentation-diagnostics-${{ github.sha }}
          path: |
            instrumentation.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Fail if instrumentation failed
        if: steps.instrument.outcome == 'failure'
        run: exit 1
